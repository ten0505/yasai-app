<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭菜園管理 v20260807</title>
<style>
:root {
  --primary:#3d7a3d; --primary-d:#2a5a2a; --primary-l:#a8d4a8;
  --accent:#e8952a; --bg:#f0f4ed; --surface:#fff; --border:#cce0cc;
  --text:#1a2e1a; --muted:#5a7a5a; --sidebar:200px; --hdr:52px; --r:8px;
  --c-harvest:#dc2626; --c-plant:#16a34a; --c-water:#2563eb;
  --c-fertilize:#ca8a04; --c-train:#ea580c; --c-spray:#7c3aed;
  --c-prepare:#92400e; --c-observe:#0891b2; --c-other:#6b7280;
  --c-plan:#93c5fd; --c-actual:#bbf7d0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;border:1px solid var(--border);border-radius:4px;padding:4px 8px;width:100%;background:#fff}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;margin-top:8px}
h2{font-size:15px;color:var(--primary-d)}
h3{font-size:13px;color:var(--primary-d)}

/* Layout */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--primary-d);
  color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#hdr h1{font-size:15px;font-weight:bold;flex:0 0 auto}
.nav-tabs{display:flex;gap:4px;flex:1}
.nav-tab{padding:5px 10px;border-radius:20px;color:rgba(255,255,255,.75);font-size:12px;transition:.2s}
.nav-tab:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-tab.active{background:#fff;color:var(--primary-d);font-weight:bold}
#toggle-sb{background:none;border:none;color:#fff;font-size:18px;width:32px;height:32px}

.layout{display:flex;margin-top:var(--hdr);height:calc(100vh - var(--hdr))}
#sidebar{width:var(--sidebar);flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#sidebar.collapsed{width:0}
.sb-head{padding:10px 10px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-head span{font-weight:bold;font-size:12px;color:var(--muted)}
.btn-sm{padding:3px 8px;background:var(--primary);color:#fff;border-radius:12px;font-size:11px}
.btn-sm:hover{background:var(--primary-d)}
#veg-list{flex:1;overflow-y:auto;padding:4px 0}
.veg-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-left:3px solid transparent;transition:.15s}
.veg-item:hover{background:var(--bg)}
.veg-item.active{background:#e8f5e8;border-left-color:var(--primary)}
.veg-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.veg-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#main{flex:1;overflow:auto}

/* Cards & panels */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;margin:10px}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-plan{background:#dbeafe;color:#1d4ed8}
.badge-actual{background:#dcfce7;color:#15803d}

/* Buttons */
.btn{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:bold;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-outline{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.btn-icon:hover{background:var(--bg)}

/* Timeline */
#timeline-wrap{padding:10px}
.tl-scroll{overflow-x:auto}
.tl-table{border-collapse:collapse;white-space:nowrap}
.tl-table th,.tl-table td{border:1px solid var(--border);padding:0}
.tl-veg-col{position:sticky;left:0;background:#fff;z-index:10;min-width:90px;max-width:90px;padding:4px 6px;
  font-size:11px;font-weight:bold;vertical-align:middle;border-right:2px solid var(--primary-l)}
.tl-head-veg{background:var(--primary-d);color:#fff;text-align:center;padding:4px 6px;font-size:11px;
  position:sticky;left:0;z-index:20}
.tl-date-head{min-width:40px;max-width:40px;text-align:center;padding:2px;font-size:10px;
  background:var(--primary-d);color:rgba(255,255,255,.8);vertical-align:middle;cursor:default}
.tl-date-head.today{background:#e8952a;color:#fff;font-weight:bold}
.tl-date-head.weekend{background:#2a4a6a;color:rgba(255,255,255,.8)}
.tl-cell{min-width:40px;max-width:40px;height:28px;vertical-align:middle;text-align:center;
  cursor:pointer;transition:.15s;position:relative}
.tl-cell:hover{background:#e8f5e8 !important}
.tl-cell.today{background:#fffbeb !important}
.tl-cell.has-data{background:#f0faf0}
.tl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 1px}
.tl-veg-btn{display:flex;align-items:center;gap:4px;width:100%;text-align:left}

/* Popup */
#popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:center;justify-content:center;display:none}
#popup.show{display:flex}
.popup-box{background:#fff;border-radius:var(--r);max-width:420px;width:94%;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.popup-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1}
.popup-body{padding:14px}
.popup-entry{padding:8px 0;border-bottom:1px solid var(--border)}
.popup-entry:last-child{border-bottom:none}

/* Detail view */
#detail-wrap{padding:10px}
.veg-header{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.veg-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:0 0 auto}
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:10px}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:bold;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn:hover{color:var(--primary)}
.field-group{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.field-item label{font-size:11px;color:var(--muted)}
.field-item .val{font-size:13px;color:var(--text);min-height:18px;padding:2px 0;word-break:break-all}
.field-item.full{grid-column:1/-1}
.section-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:12px;margin-bottom:8px}
.section-title{font-size:12px;font-weight:bold;color:var(--primary-d);margin-bottom:8px;
  padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}

/* Schedule list */
.sched-item{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
  padding:10px 12px;margin-bottom:6px;display:flex;gap:10px}
.sched-item .left{flex:0 0 auto;text-align:center;min-width:52px}
.sched-item .date{font-size:14px;font-weight:bold;color:var(--primary-d)}
.sched-item .time{font-size:10px;color:var(--muted)}
.sched-item .right{flex:1;min-width:0}
.sched-item .act{font-weight:bold;font-size:13px;margin-bottom:3px}
.sched-item .memo{font-size:11px;color:var(--muted)}
.sched-item .photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;margin-top:4px;margin-right:3px}
.sched-item .photo-thumbs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sched-actions{display:flex;gap:4px;margin-top:4px}

/* Photos grid (form & detail) */
.photos-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.photo-item{position:relative;width:80px;height:80px;flex:0 0 auto}
.photo-item img{width:80px;height:80px;object-fit:cover;border-radius:4px;display:block}
.photo-del{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;border-radius:50%;
  width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;line-height:1;padding:0}
.detail-photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.detail-photos img{max-width:48%;max-height:200px;border-radius:6px;object-fit:cover;cursor:pointer}

/* Harvest table */
.harvest-table{width:100%;border-collapse:collapse;font-size:12px}
.harvest-table th{background:var(--primary-d);color:#fff;padding:6px 8px;text-align:left}
.harvest-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.harvest-table tr:hover td{background:var(--bg)}
.harvest-total{font-weight:bold;background:#e8f5e8 !important}

/* Form */
#form-wrap{padding:10px;max-width:600px}
.form-row{margin-bottom:10px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-preview{max-width:200px;max-height:150px;border-radius:6px;margin-top:6px}
.photo-add-btn{margin-top:6px;font-size:12px;padding:5px 12px}
.gphoto-link{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;color:#1a73e8;
  text-decoration:none;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:2px 10px}
.gphoto-link:hover{background:#dbeafe}

/* 実施事項 複数選択グリッド */
.act-check-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act-check-label{display:inline-flex;align-items:center;padding:5px 11px;border:1.5px solid var(--border);
  border-radius:16px;cursor:pointer;font-size:12px;user-select:none;transition:.15s;background:#fff}
.act-check-label:hover{border-color:var(--primary);background:#f0f8f0}
.act-check-label.checked{background:var(--primary);color:#fff;border-color:var(--primary-d)}
.act-check-label input[type=checkbox]{display:none}
.form-actions{display:flex;gap:8px;margin-top:16px;padding-top:10px;border-top:1px solid var(--border)}

/* Variety tags */
.variety-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.vtag{padding:2px 8px;background:var(--primary-l);color:var(--primary-d);border-radius:12px;font-size:11px}

/* Settings */
#settings-wrap{padding:10px;max-width:500px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--primary-l);border-radius:3px}

/* Tooltip */
.tl-cell[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:4px 8px;border-radius:4px;white-space:nowrap;font-size:11px;z-index:50;pointer-events:none}

/* Responsive */
@media(max-width:640px){
  .nav-tabs .nav-tab span{display:none}
  #sidebar{position:absolute;top:var(--hdr);bottom:0;left:0;z-index:50;box-shadow:2px 0 8px rgba(0,0,0,.2)}
  #sidebar.collapsed{width:0}
  .field-group{grid-template-columns:1fr}
}
</style>
</head>

// ===================== IMAGE COMPRESSION =====================
// createObjectURL でメモリ効率よく読み込み → Canvas で 800px/JPEG65% に圧縮
// readAsDataURL は Base64 変換で数十MB消費するためスマホで応答不能になる問題を回避
function _compressImage(file, callback) {
  const MAX_PX = 500;   // 800→500px（Firebase転送量を約60%削減）
  const QUALITY = 0.60; // 65%→60%（家庭菜園の記録には十分な画質）
  const blobUrl = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(blobUrl); // 即座に解放してメモリを節約
    let w = img.width, h = img.height;
    if (w > MAX_PX || h > MAX_PX) {
      if (w >= h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
      else        { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const result = canvas.toDataURL('image/jpeg', QUALITY);
    canvas.width = 0; canvas.height = 0; // canvasメモリを即座に解放
    callback(result);
  };
  img.onerror = () => {
    // HEIC等で読めない場合はFileReaderでフォールバック（iOS対応）
    URL.revokeObjectURL(blobUrl);
    const reader = new FileReader();
    reader.onload = ev => callback(ev.target.result);
    reader.onerror = () => callback(null); // 完全に失敗した場合
    reader.readAsDataURL(file);
  };
  img.src = blobUrl;
}

// 野菜オブジェクトに必須ネストプロパティを補完（旧形式データとの後方互換）
function _normalizeVeg(v){
  if(!v) return v;
  if(!Array.isArray(v.varieties)) v.varieties=[];
  if(!v.tax || typeof v.tax!=='object') v.tax={};
  v.tax.order  = v.tax.order  ?? '';
  v.tax.family = v.tax.family ?? '';
  v.tax.genus  = v.tax.genus  ?? '';
  if(!v.traits || typeof v.traits!=='object') v.traits={};
  v.traits.origin     = v.traits.origin     ?? '';
  v.traits.coldHeat   = v.traits.coldHeat   ?? '';
  v.traits.water      = v.traits.water      ?? '';
  v.traits.fertilizer = v.traits.fertilizer ?? '';
  v.traits.other      = v.traits.other      ?? '';
  if(!v.mgmt || typeof v.mgmt!=='object') v.mgmt={};
  ['soil','ridge','sow','transplant','water','train','fertilize',
   'bud','leaf','spray','flowerFruit','harvest','storage','expected'
  ].forEach(k=>{ v.mgmt[k] = v.mgmt[k] ?? ''; });
  return v;
}

// localStorage に保存。
// クラウド同期が有効な端末では写真を localStorage に持たない（写真の正本は Firebase）。
// これにより localStorage の容量超過を根本的に防ぐ。写真は起動時に Firebase から再取得される。
// クラウド未設定の端末のみ写真込みで保存し、容量超過時は写真なしでリトライ（テキストは必ず残す）
function _saveLocal(){
  const hasCloud = !!localStorage.getItem('yasai_fb');
  try {
    localStorage.setItem('yasai_v2', JSON.stringify(hasCloud ? _dataWithoutPhotos() : D));
  } catch(e) {
    console.warn('localStorage full, retrying without photos:', e);
    try {
      localStorage.setItem('yasai_v2', JSON.stringify(_dataWithoutPhotos()));
    } catch(e2) {
      console.warn('localStorage save failed completely:', e2);
    }
  }
}

function saveData(){
  _saveLocal();
  saveToCloud();
}

function loadCloudConfig() {
  try {
    const raw = localStorage.getItem('yasai_fb');
    if (!raw) { updateSyncBadge('none'); return; }
    const saved = JSON.parse(raw);
    // 内蔵設定がある場合は接続情報を常に最新の内蔵値で上書きする
    // （Firebaseプロジェクトを差し替えた際、各端末は同期キーそのままで自動的に新DBへ接続される）
    const config = DEFAULT_FB_CONFIG || saved.config;

function initFirebase(config) {
  FB_ERROR = null;
  clearTimeout(FB_TIMEOUT);
  updateSyncBadge('connecting');

  // 15秒以内に接続できなければタイムアウトエラーを表示
  FB_TIMEOUT = setTimeout(() => {
    if (!FB_DB) {
      FB_ERROR = 'タイムアウト：Firebaseに接続できませんでした。\ndatabaseURLとデータベースのルール設定を確認してください。';
      updateSyncBadge('error');
      render();
    }
  }, 15000);

  _loadSDK(() => {
    // 既存のFirebaseアプリがあれば削除してから再初期化（再設定時のエラー防止）
    const doInit = () => {
      try {
        window.firebase.initializeApp(config);
        FB_DB = window.firebase.database();
        clearTimeout(FB_TIMEOUT);

        FB_DB.ref('yasai/'+FB_KEY).once('value').then(snap => {
          const d = snap.val();
          if (d && (d.meta || d.vegetables)) {
            // Firebase にデータあり：新旧両形式から写真を抽出してマージ
            const photosObj = _extractPhotosFromFirebase(d);
            const metaNode = d.meta && d.meta.vegetables ? d.meta
                       : { vegetables: d.vegetables, schedules: d.schedules, harvests: d.harvests };
            const firebaseData = _mergePhotosIntoData(metaNode, photosObj);

            // ── ローカルにしかないスケジュールを保持（Firebase接続前に追加したものを失わない）
            const fbIds = new Set((firebaseData.schedules||[]).map(s => s.id));
            const localOnly = (D.schedules||[]).filter(s => !fbIds.has(s.id));
            if (localOnly.length > 0) {
              firebaseData.schedules = [...firebaseData.schedules, ...localOnly];
            }
            // ── harvestsById ノードからも収穫データを取得・マージ ──
            // （即時書き込み方式で保存されたデータを確実に読み込む）
            const harvestsByIdNode = d.harvestsById;
            if (harvestsByIdNode && typeof harvestsByIdNode === 'object') {
              const hbMap = {};
              (firebaseData.harvests||[]).forEach(h => { if(h&&h.id) hbMap[h.id]=h; });
              Object.values(harvestsByIdNode).forEach(h => {
                if (h && h.id && !_pendingHarvestDeletes.has(h.id)) hbMap[h.id] = h;
              });
              firebaseData.harvests = Object.values(hbMap);
            }
            // ── ローカルにしかない収穫データを保持 ──
            const fbHarvestIds = new Set((firebaseData.harvests||[]).map(h => h.id));
            const localOnlyHarvests = (D.harvests||[]).filter(h =>
              !fbHarvestIds.has(h.id) && !_pendingHarvestDeletes.has(h.id)
            );
            if (localOnlyHarvests.length > 0) {
              firebaseData.harvests = [...firebaseData.harvests, ...localOnlyHarvests];
            }
            // ── Firebase に未到達のローカル写真を救済する ──
            // initFirebase が D を上書きする前に、Firebase に届いていない写真を
            // ローカルの D から firebaseData に補完する（写真が消えるのを防ぐ）
            const localPhotoMap = {};
            (D.schedules||[]).forEach(s => {
              const ps = s.photos && s.photos.length ? s.photos : s.photo ? [s.photo] : [];
              if (ps.length && !photosObj[s.id]) localPhotoMap[s.id] = ps;
            });
            if (Object.keys(localPhotoMap).length > 0) {
              firebaseData.schedules = firebaseData.schedules.map(s =>
                localPhotoMap[s.id]
                  ? Object.assign({}, s, { photos: localPhotoMap[s.id], photo: localPhotoMap[s.id][0] })
                  : s
              );
            }
            D = firebaseData;
            _saveLocal();
            // Firebase から取得した写真は既に同期済みとして記録する
            // （次回保存時に全写真を再送信してしまうのを防ぐ）
            Object.keys(photosObj).forEach(id => _syncedPhotoIds.add(id));

            // ローカルにしかない記録があるか、接続前に保存が要求されていれば Firebase に反映
            const needsPush = localOnly.length > 0 || localOnlyHarvests.length > 0 || _saveQueuedForConnect || !d.meta || Object.keys(localPhotoMap).length > 0;
            _saveQueuedForConnect = false;
            if (needsPush) setTimeout(() => saveToCloud(), 500);
          } else {
            // Firebase が空: ローカルデータ（写真含む）を Firebase にプッシュ
            _saveQueuedForConnect = false;
            saveToCloud();
          }
          FB_ERROR = null;
          updateSyncBadge('ok');
          _startListener();       // テキスト・メタデータの変更を監視（meta のみ・帯域節約）
          // _startPhotoListener は無効（写真は initFirebase の once + _startListener で管理）
          _startHarvestListener();// 収穫データの変更を独立して監視
          // 編集フォームが開いている最中はフォームを再描画しない（_editPhotos がリセットされ入力中の写真が消えるのを防ぐ）
          { const EV=['add-sched','add-harvest','add-veg']; if(EV.includes(S.view)){renderSidebar();}else{render();} }
        }).catch(err => {
          FB_ERROR = 'データ読み込みエラー：' + (err.message || err.code || String(err));
          updateSyncBadge('error');
          { const EV=['add-sched','add-harvest','add-veg']; if(!EV.includes(S.view)) render(); }
        });
      } catch(e) {
        clearTimeout(FB_TIMEOUT);
        FB_ERROR = '初期化エラー：' + (e.message || String(e));
        updateSyncBadge('error');
        render();
      }
    };

    try {
      if (window.firebase.apps && window.firebase.apps.length) {
        // 既存アプリを全削除してから再初期化
        Promise.all(window.firebase.apps.map(app => app.delete())).then(doInit).catch(doInit);
      } else {
        doInit();
      }
    } catch(e) {
      doInit();
    }
  });
}

function _loadSDK(cb) {
  if (window.firebase && window.firebase.database) { cb(); return; }
  const s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onerror = () => updateSyncBadge('error');
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
    s2.onerror = () => updateSyncBadge('error');
    s2.onload = cb;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function _startListener() {
  if (!FB_DB || !FB_KEY) return;
  if (FB_LISTENER) FB_DB.ref('yasai/'+FB_KEY+'/meta').off('value', FB_LISTENER);
  // 【帯域節約】写真データを含む yasai/KEY 全体ではなく meta のみを監視
  // 写真は initFirebase の once('value') で初回のみ取得する
  FB_LISTENER = FB_DB.ref('yasai/'+FB_KEY+'/meta').on('value', snap => {
    const meta = snap.val();
    if (!meta || !meta.vegetables) return;
    // meta のみのスナップショット → D が持つ現在の写真を引き継いで使う（帯域節約）
    // D の写真が空の場合は Firebase の photos ノードから補完する
    let incoming;
    {
      const currentPhotos = {};
      (D.schedules||[]).forEach(s => {
        const ps = s.photos && s.photos.length ? s.photos : s.photo ? [s.photo] : [];
        if (ps.length) currentPhotos[s.id] = ps;
      });
      incoming = _mergePhotosIntoData(meta, currentPhotos);
    }

    // ── 変化検知 ──────────────────────────────────────────────────────────
    // スケジュールは「件数・並び・内容」すべて比較（PCでの編集も検知するため）
    // ※ 順序に依存しないよう ID でソートして比較
    const _schedKey = s =>
      `${s.id}|${s.date}|${s.act}|${s.memo||''}|${s.vid}|${String(s.plan)}|${s.timeFrom||''}|${s.timeTo||''}|${s.gphoto||''}`;
    const _schedHash = arr =>
      (arr||[]).map(_schedKey).sort().join('\n');
    const _photoCount = arr =>
      (arr||[]).reduce((s,x)=>s+(x.photos&&x.photos.length?x.photos.length:x.photo?1:0),0);
    // 収穫データはID・個数・日付・品種・メモで比較（プロパティ順に依存しない）
    const _harvestKey = h =>
      `${h.id}|${h.count}|${h.date}|${h.vid}|${h.variety||''}|${h.memo||''}`;
    const _harvestHash = arr =>
      (arr||[]).map(_harvestKey).sort().join('\n');

    const changed =
      _schedHash(incoming.schedules) !== _schedHash(D.schedules) ||
      _photoCount(incoming.schedules) !== _photoCount(D.schedules) ||
      JSON.stringify(incoming.vegetables) !== JSON.stringify(D.vegetables) ||
      _harvestHash(incoming.harvests)     !== _harvestHash(D.harvests);

    if (changed) {
      // ── ローカルにしかないスケジュールを保持（削除済みは除く）
      const inIds = new Set((incoming.schedules||[]).map(s => s.id));
      const localOnly = (D.schedules||[]).filter(s =>
        !inIds.has(s.id) && !_pendingPhotoDeletes.has(s.id)
      );
      if (localOnly.length > 0) {
        incoming.schedules = [...incoming.schedules, ...localOnly];
      }

      // ── ローカルにしかない収穫データを保持（削除済みは除く）───────────────
      // 収穫入力後にリスナーが発火してFirebaseの古いデータで上書きされるのを防ぐ
      const inHarvestIds = new Set((incoming.harvests||[]).map(h => h.id));
      const localOnlyHarvests = (D.harvests||[]).filter(h =>
        !inHarvestIds.has(h.id) && !_pendingHarvestDeletes.has(h.id)
      );
      if (localOnlyHarvests.length > 0) {
        incoming.harvests = [...incoming.harvests, ...localOnlyHarvests];
      }

      // ローカルにしかないデータがある場合は Firebase にも反映
      if (localOnly.length > 0 || localOnlyHarvests.length > 0) {
        setTimeout(() => saveToCloud(), 1000);
      }

      // ── incoming.harvests から削除済み収穫が復活しないよう除外 ──────────────
      if (_pendingHarvestDeletes.size > 0) {
        incoming.harvests = (incoming.harvests||[]).filter(h => !_pendingHarvestDeletes.has(h.id));
      }

      // ── 写真の引き継ぎ（端末の役割に応じて判断）────────────────────────────
      // 写真アップロード端末（スマホ）：D の写真を常に優先
      //   → Firebase の古いデータで編集中の写真が上書きされるのを防ぐ
      // 写真受信のみ端末（PC）：Firebase の写真を優先し、なければ D の写真をフォールバック
      const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';
      const prevPhotos = {};
      (D.schedules||[]).forEach(s => {
        const ps = s.photos && s.photos.length ? s.photos : s.photo ? [s.photo] : [];
        if (ps.length) prevPhotos[s.id] = { photos: ps, photo: ps[0] };
      });
      incoming.schedules = incoming.schedules.map(s => {
        const prev = prevPhotos[s.id];
        if (pushPhotos && prev) {
          // 写真アップロード端末：D に写真があれば常に D の写真を優先
          // （Firebase には古い写真しかない可能性があるため）
          return Object.assign({}, s, prev);
        }
        // 写真受信のみ端末：Firebase の写真を使い、ない場合は D の写真で補完
        if (s.photos && s.photos.length) return s;
        if (s.photo) return s;
        return prev ? Object.assign({}, s, prev) : s;
      });

      D = incoming;
      _saveLocal();
      const EDIT_VIEWS = ['add-sched', 'add-harvest', 'add-veg'];
      if (!EDIT_VIEWS.includes(S.view)) render();
    }
    updateSyncBadge('ok');
  });
}

// ── 写真専用リスナー ──────────────────────────────────────────────────────────
// yasai/KEY/photos ノードを独立して監視する。
// 【端末ごとの動作】
//   写真アップロード端末（スマホ：pushPhotos=true）:
//     D に写真がある場合はスキップ（ローカル編集中の写真をFirebaseの古いデータで上書きしない）
//     D に写真がない場合のみ Firebase から取得
//   写真受信のみ端末（PC：pushPhotos=false）:
//     常に Firebase を信頼して最新写真を取得
function _startPhotoListener() {
  if (!FB_DB || !FB_KEY) return;
  if (FB_PHOTO_LISTENER) {
    try { FB_DB.ref('yasai/'+FB_KEY+'/photos').off('value', FB_PHOTO_LISTENER); } catch(e) {}
    FB_PHOTO_LISTENER = null;
  }
  FB_PHOTO_LISTENER = FB_DB.ref('yasai/'+FB_KEY+'/photos').on('value', snap => {
    const photosNode = snap.val();
    if (!photosNode || typeof photosNode !== 'object') return;

    const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';

    let photoChanged = false;
    const newSchedules = D.schedules.map(s => {
      const rawPs = photosNode[s.id];
      if (!rawPs) return s;
      // Firebase SDK が配列をオブジェクトとして返す場合に対応
      const ps = Array.isArray(rawPs) ? rawPs : Object.values(rawPs).filter(Boolean);
      if (!ps.length) return s;
      const curLen = s.photos && s.photos.length ? s.photos.length : s.photo ? 1 : 0;

      if (pushPhotos && curLen > 0) {
        // 写真アップロード端末：D に写真があればスキップ（ローカル変更を保護）
        // Firebase の古いデータで新しく入力した写真が上書きされるのを防ぐ
        return s;
      }

      // 写真受信のみ端末（PC）または D に写真がない場合：Firebase を信頼して更新
      if (ps.length !== curLen || JSON.stringify(ps) !== JSON.stringify(s.photos)) {
        photoChanged = true;
        return Object.assign({}, s, { photos: ps, photo: ps[0] || null });
      }
      return s;
    });

    if (photoChanged) {
      D = Object.assign({}, D, { schedules: newSchedules });
      _saveLocal();
      const EDIT_VIEWS = ['add-sched', 'add-harvest', 'add-veg'];
      if (!EDIT_VIEWS.includes(S.view)) render();
    }
  });
}

// ── 収穫データ専用リスナー ────────────────────────────────────────────────────
// harvestsById ノード（個別パス）と meta/harvests の両方を監視する。
// スマホが即時書き込みした harvestsById の変化を確実に PC へ反映する。
function _startHarvestListener() {
  if (!FB_DB || !FB_KEY) return;
  if (FB_HARVEST_LISTENER) {
    try { FB_DB.ref('yasai/'+FB_KEY+'/harvestsById').off('value', FB_HARVEST_LISTENER); } catch(e) {}
    FB_HARVEST_LISTENER = null;
  }

  // harvestsById ノードを監視（即時書き込みの受け取り）
  FB_HARVEST_LISTENER = FB_DB.ref('yasai/'+FB_KEY+'/harvestsById').on('value', snap => {
    const raw = snap.val();
    if (!raw || typeof raw !== 'object') return;

    // Firebase SDK が配列をオブジェクトとして返す場合も正規化
    const fbEntries = Object.values(raw).filter(h => h && h.id);

    // D.harvests と Firebase の収穫をマージ
    const localMap = {};
    (D.harvests||[]).forEach(h => { if (h && h.id) localMap[h.id] = h; });

    let changed = false;
    fbEntries.forEach(h => {
      if (_pendingHarvestDeletes.has(h.id)) return;
      const local = localMap[h.id];
      if (!local) {
        localMap[h.id] = h;
        changed = true;
      } else {
        const fbStr = `${h.count}|${h.date}|${h.variety||''}|${h.memo||''}`;
        const lcStr = `${local.count}|${local.date}|${local.variety||''}|${local.memo||''}`;
        if (fbStr !== lcStr) { localMap[h.id] = h; changed = true; }
      }
    });

    if (changed) {
      D.harvests = Object.values(localMap).sort((a,b) => (b.date||'').localeCompare(a.date||''));
      _saveLocal();
      const EDIT_VIEWS = ['add-sched', 'add-harvest', 'add-veg'];
      if (!EDIT_VIEWS.includes(S.view)) render();
    }
  });
}

// ---- Firebase データ分割／統合ヘルパー ----
// 写真（base64）を別ノードに分けてサイズ問題を回避する
// 構造: yasai/KEY/meta（テキスト）+ yasai/KEY/photos/SCHED_ID（写真配列）

function _splitDataForCloud() {
  const photosObj = {};
  const schedules = D.schedules.map(s => {
    const ps = s.photos && s.photos.length ? s.photos : s.photo ? [s.photo] : [];
    if (ps.length) photosObj[s.id] = ps;
    // 写真データを除いたスケジュールエントリ
    const stripped = Object.assign({}, s);
    delete stripped.photos;
    delete stripped.photo;
    return stripped;
  });
  return {
    meta: { vegetables: D.vegetables, schedules, harvests: D.harvests },
    photosObj
  };
}

function _mergePhotosIntoData(meta, photosObj) {
  const photos = photosObj || {};
  // Firebase SDK は配列を {0:...,1:...} のオブジェクトとして返す場合がある
  // → vegetables / schedules / harvests すべてを必ず配列に正規化する
  const toArr = v => !v ? [] : Array.isArray(v) ? v : (typeof v === 'object' ? Object.values(v) : []);
  return {
    vegetables: toArr(meta.vegetables).map(v => _normalizeVeg(Object.assign({}, v))),
    schedules: toArr(meta.schedules).map(s => {
      const ps = toArr(photos[s.id]);
      return Object.assign({}, s, { photos: ps, photo: ps[0] || null });
    }),
    harvests: toArr(meta.harvests)
  };
}

// Firebase ノード全体から写真を抽出
// 新形式（d.photos.SCHED_ID）と旧形式（d.schedules[x].photos 埋め込み）の両方に対応
// Firebase SDK が配列を {0:...,1:...} のオブジェクトとして返す場合も正規化する
function _extractPhotosFromFirebase(d) {
  const photosObj = {};
  // 新形式: yasai/KEY/photos/SCHED_ID = [base64, ...]
  if (d.photos && typeof d.photos === 'object') {
    Object.keys(d.photos).forEach(k => {
      const val = d.photos[k];
      if (!val) return;
      if (Array.isArray(val)) {
        photosObj[k] = val;
      } else if (typeof val === 'object') {
        // Firebase SDK が配列を {0:...,1:...} 形式のオブジェクトとして返した場合を正規化
        const arr = Object.values(val).filter(Boolean);
        if (arr.length) photosObj[k] = arr;
      }
    });
  }
  // 旧形式: schedules に photos/photo が埋め込まれている場合を補完
  // d.schedules（ルートレベル）と d.meta.schedules の両方をチェック
  const toScheds = v => Array.isArray(v) ? v : (v && typeof v === 'object') ? Object.values(v) : [];
  [...toScheds(d.schedules), ...toScheds(d.meta && d.meta.schedules)].forEach(s => {
    if (!s || !s.id || photosObj[s.id]) return; // 新形式で取得済みならスキップ
    const ps = (s.photos && s.photos.length) ? s.photos : s.photo ? [s.photo] : [];
    if (ps.length) photosObj[s.id] = ps;
  });
  return photosObj;
}

let _syncTimer = null;
let _saveQueuedForConnect = false; // Firebase接続前にsaveToCloudを呼んだ場合のフラグ

function saveToCloud() {
  if (!FB_DB || !FB_KEY) {
    // まだFirebaseに繋がっていない → 接続完了後に実行するようフラグを立てる
    _saveQueuedForConnect = true;
    return;
  }
  updateSyncBadge('syncing');
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_flushSaveToCloud, 500);
}

// ── saveToCloud の本体（debounce後に実行）───────────────────────────────────
// Firebase の schedules と harvests を先読みしてからマージして書き込む（read-modify-write）。
// これにより「端末A保存時に端末Bが追加したデータが消える」問題を防ぐ。
function _flushSaveToCloud() {
  const { meta, photosObj } = _splitDataForCloud();

  Promise.all([
    FB_DB.ref('yasai/'+FB_KEY+'/meta/schedules').once('value'),
    FB_DB.ref('yasai/'+FB_KEY+'/meta/harvests').once('value')
  ]).then(([schedSnap, harvestSnap]) => {

    // ── スケジュールのマージ ──
    const rawScheds = schedSnap.val();
    const cloudScheds = Array.isArray(rawScheds) ? rawScheds
                      : (rawScheds && typeof rawScheds === 'object') ? Object.values(rawScheds) : [];
    const localIds = new Set(meta.schedules.map(s => s.id));
    cloudScheds.forEach(s => {
      if (s && s.id && !localIds.has(s.id) && !_pendingPhotoDeletes.has(s.id)) {
        meta.schedules.push(s);
        if (!D.schedules.find(x => x.id === s.id)) {
          D.schedules.push(Object.assign({}, s, { photos: [], photo: null }));
        }
      }
    });

    // ── 収穫データのマージ ──
    // 他端末が追加した収穫を保持する（書き込み競合で消えないようにする）
    const rawHarvests = harvestSnap.val();
    const cloudHarvests = Array.isArray(rawHarvests) ? rawHarvests
                        : (rawHarvests && typeof rawHarvests === 'object') ? Object.values(rawHarvests) : [];
    const localHarvestIds = new Set(meta.harvests.map(h => h.id));
    cloudHarvests.forEach(h => {
      if (h && h.id && !localHarvestIds.has(h.id) && !_pendingHarvestDeletes.has(h.id)) {
        meta.harvests.push(h);
        if (!D.harvests.find(x => x.id === h.id)) {
          D.harvests.push(Object.assign({}, h));
        }
      }
    });

    _commitCloudWrite(meta, photosObj);
  }).catch(() => _commitCloudWrite(meta, photosObj)); // 読み取り失敗時はそのまま書き込む
}

function _commitCloudWrite(meta, photosObj) {
  const updates = {};
  updates['yasai/'+FB_KEY+'/meta'] = meta;

  // 写真はデバイスの設定に従い Firebase へ書き込む
  // ── 既に送信済み（_syncedPhotoIds）の写真は再送信しない ──
  // （毎回の保存で全写真を再アップロードすると通信量が膨大になり、
  //   モバイル回線で同期バッジが「同期中」のまま固まる原因になっていた）
  const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';
  const idsToSend = [];
  if (pushPhotos) {
    Object.keys(photosObj).forEach(id => {
      if (!_syncedPhotoIds.has(id)) {
        updates['yasai/'+FB_KEY+'/photos/'+id] = photosObj[id];
        idsToSend.push(id);
      }
    });
  }
  // 削除されたスケジュールの写真は端末設定に関わらず消す
  _pendingPhotoDeletes.forEach(id => {
    updates['yasai/'+FB_KEY+'/photos/'+id] = null;
    _syncedPhotoIds.delete(id);
  });

  _withTimeout(FB_DB.ref().update(updates), 20000)
    .then(() => {
      idsToSend.forEach(id => _syncedPhotoIds.add(id));
      _pendingPhotoDeletes.clear(); _pendingHarvestDeletes.clear(); updateSyncBadge('ok');
    })
    .catch(err => { console.error('saveToCloud error:', err); updateSyncBadge('error'); });
}

// この端末のデータ（写真含む）をクラウドへ強制プッシュ
function forcePushToCloud() {
  if (!FB_DB || !FB_KEY) { alert('Firebase に接続されていません'); return; }
  updateSyncBadge('syncing');
  const { meta, photosObj } = _splitDataForCloud();
  const updates = {};
  updates['yasai/'+FB_KEY+'/meta'] = meta;
  // 写真は個別パスで更新（bulkで上書きすると他端末の写真が消えるのを防ぐ）
  const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';
  if (pushPhotos) {
    Object.keys(photosObj).forEach(id => {
      updates['yasai/'+FB_KEY+'/photos/'+id] = photosObj[id];
    });
  }
  _pendingPhotoDeletes.forEach(id => {
    updates['yasai/'+FB_KEY+'/photos/'+id] = null;
  });
  _withTimeout(FB_DB.ref().update(updates), 30000)
    .then(() => {
      Object.keys(photosObj).forEach(id => _syncedPhotoIds.add(id));
      _pendingPhotoDeletes.clear();
      updateSyncBadge('ok');
      alert('✅ この端末のデータをクラウドへ送信しました！\n他の端末でページを再読み込みすると反映されます。');
    })
    .catch(err => { updateSyncBadge('error'); alert('同期エラー：' + (err.message || String(err))); });
}

// Firebase から最新の収穫データを取得して D.harvests にマージする
// 収穫データのみ（meta/harvests + harvestsById）を取得し帯域を節約する
function _fetchAndMergeHarvests() {
  if (!FB_DB || !FB_KEY) return Promise.resolve();
  const toArr = v => !v ? [] : Array.isArray(v) ? v : (typeof v === 'object' ? Object.values(v) : []);
  return Promise.all([
    FB_DB.ref('yasai/'+FB_KEY+'/meta/harvests').once('value'),
    FB_DB.ref('yasai/'+FB_KEY+'/harvestsById').once('value')
  ]).then(([metaSnap, byIdSnap]) => {
    const hMap = {};
    toArr(metaSnap.val()).forEach(h => { if(h&&h.id) hMap[h.id]=h; });
    const byId = byIdSnap.val();
    if(byId && typeof byId === 'object'){
      Object.values(byId).forEach(h => { if(h&&h.id&&!_pendingHarvestDeletes.has(h.id)) hMap[h.id]=h; });
    }
    const fbHarvests = Object.values(hMap);
    if(!fbHarvests.length) return;
    const localMap = {};
    (D.harvests||[]).forEach(h => { if(h&&h.id) localMap[h.id]=h; });
    let changed = false;
    fbHarvests.forEach(h => {
      const local = localMap[h.id];
      if(!local){ localMap[h.id]=h; changed=true; }
      else {
        const fs=`${h.count}|${h.date}|${h.variety||''}|${h.memo||''}`;
        const ls=`${local.count}|${local.date}|${local.variety||''}|${local.memo||''}`;
        if(fs!==ls){ localMap[h.id]=h; changed=true; }
      }
    });
    if(changed){
      D.harvests = Object.values(localMap);
      _saveLocal();
    }
  }).catch(()=>{});
}

// クラウドの最新データ（他の端末の写真含む）をこの端末へ強制取得
function forcePullFromCloud() {
  if (!FB_DB || !FB_KEY) { alert('Firebase に接続されていません'); return; }
  updateSyncBadge('connecting');
  FB_DB.ref('yasai/'+FB_KEY).once('value').then(snap => {
    const d = snap.val();
    if (!d) { alert('クラウドにデータがありません'); updateSyncBadge('ok'); return; }
    let merged;
    if (d.meta && d.meta.vegetables) {
      // 新旧両形式から写真を抽出してマージ
      merged = _mergePhotosIntoData(d.meta, _extractPhotosFromFirebase(d));
    } else if (d.vegetables) {
      // 旧形式
      const photosObj = _extractPhotosFromFirebase(d);
      merged = _mergePhotosIntoData(
        { vegetables: d.vegetables, schedules: d.schedules, harvests: d.harvests },
        photosObj
      );
    } else {
      alert('クラウドのデータ形式が不正です'); updateSyncBadge('ok'); return;
    }
    // harvestsById（即時書き込みパス）も統合
    const toArr2 = v => !v ? [] : Array.isArray(v) ? v : (typeof v === 'object' ? Object.values(v) : []);
    if(d.harvestsById && typeof d.harvestsById === 'object'){
      const hMap = {};
      (merged.harvests||[]).forEach(h => { if(h&&h.id) hMap[h.id]=h; });
      Object.values(d.harvestsById).forEach(h => { if(h&&h.id) hMap[h.id]=h; });
      merged.harvests = Object.values(hMap);
    }
    D = merged;
    _saveLocal();
    // クラウドから取得した写真は同期済みとして記録（次回保存時の全件再送信を防ぐ）
    D.schedules.forEach(s => { if (s.photos && s.photos.length) _syncedPhotoIds.add(s.id); });
    updateSyncBadge('ok');
    // 設定タブから離れて確認しやすいビューへ
    if (S.view === 'settings') { S.view = 'timeline'; }
    render();
    const photoSchedCount = D.schedules.filter(s=>s.photos&&s.photos.length>0).length;
    const totalPhotos = D.schedules.reduce((n,s)=>n+(s.photos?s.photos.length:0),0);
    const fbPhotoCount = d.photos ? Object.keys(d.photos).length : 0;
    alert('✅ クラウドのデータを取得しました\n\n' +
      'Firebase の写真ノード: ' + fbPhotoCount + '件\n' +
      '読み込んだ写真数: ' + totalPhotos + '枚\n' +
      '写真あり作業記録: ' + photoSchedCount + '件\n\n' +
      (totalPhotos === 0 && fbPhotoCount > 0 ? '⚠️ 写真の読み込みに失敗しています' :
       totalPhotos === 0 ? '📷 クラウドに写真データがありません' :
       '→ 野菜を選んでスケジュールタブで写真を確認してください'));
  }).catch(err => {
    updateSyncBadge('error');
    alert('取得エラー：' + (err.message || String(err)));
  });
}

// Firebase の接続・読み書きを診断する
function runFirebaseDiagnostic() {
  if (!FB_DB || !FB_KEY) { alert('Firebase に接続されていません。設定タブでFirebaseを設定してください。'); return; }
  const diagEl = document.getElementById('cloud-diag-btn');
  if (diagEl) { diagEl.textContent = '⏳ 診断中(最大25秒)...'; diagEl.disabled = true; }

  const done = (results) => {
    if (diagEl) { diagEl.textContent = '🔍 Firebase 書き込みテスト（不具合診断）'; diagEl.disabled = false; }
    alert('【Firebase 診断結果】\n\n' + results.join('\n'));
  };

  // 設定情報を取得
  const results = [];
  const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';
  try {
    const raw = localStorage.getItem('yasai_fb');
    const saved = raw ? JSON.parse(raw) : {};
    const cfg = saved.config || {};
    results.push('🔧 設定情報:');
    results.push('   databaseURL: ' + (cfg.databaseURL || '未設定'));
    results.push('   projectId: '   + (cfg.projectId   || '未設定'));
    results.push('   同期キー: '    + (saved.key       || '未設定'));
  } catch(e) { results.push('設定読み込みエラー'); }
  results.push('');
  results.push('📱 デバイスデータ: 作業記録' + D.schedules.length + '件 / 収穫記録' + D.harvests.length + '件');
  results.push('📷 写真同期: ' + (pushPhotos ? 'ON' : 'OFF'));
  results.push('');

  // ① サーバー接続確認（.info/connected）
  let connChecked = false;
  const connTimeout = setTimeout(() => {
    if (!connChecked) {
      connChecked = true;
      results.push('❌ サーバー接続: タイムアウト');
      results.push('');
      results.push('━━ 考えられる原因 ━━');
      results.push('① databaseURL が間違っている');
      results.push('   → Firebaseコンソールで正しいURLを確認し');
      results.push('     設定タブ→「設定を再入力」してください');
      results.push('');
      results.push('② Realtime Database が存在しない');
      results.push('   → コンソール→構築→Realtime Database→作成');
      results.push('');
      results.push('③ ネットワークがFirebaseをブロックしている');
      results.push('   → Wi-Fiを切り替えてみてください');
      done(results);
    }
  }, 5000);

  FB_DB.ref('.info/connected').once('value').then(snap => {
    if (connChecked) return;
    clearTimeout(connTimeout);
    connChecked = true;
    const connected = snap.val();
    results.push(connected ? '✅ サーバー接続: 確立' : '❌ サーバー接続: オフライン（Firebaseに届いていない）');
    results.push('');

    if (!connected) {
      results.push('━━ 接続できない原因 ━━');
      results.push('① databaseURL が間違っている可能性が高い');
      results.push('   正しいURLの確認方法:');
      results.push('   Firebaseコンソール → プロジェクト設定 →');
      results.push('   「マイアプリ」→ firebaseConfig の databaseURL');
      results.push('');
      results.push('② Realtime Database のリージョンが');
      results.push('   URLに含まれていない（-default-rtdb が必要）');
      results.push('   正しい例: https://プロジェクト名-default-rtdb.firebaseio.com/');
      results.push('            https://プロジェクト名-default-rtdb.asia-southeast1.firebasedatabase.app/');
      done(results);
      return;
    }

    // ② Firebase に保存済みの写真数を確認
    FB_DB.ref('yasai/'+FB_KEY+'/photos').once('value').then(photoSnap => {
      const ph = photoSnap.val();
      const photoCount = ph ? Object.keys(ph).length : 0;
      results.push('📷 Firebase の写真保存数: ' + photoCount + '件');
      results.push('   ※ スマホで写真を登録してから5秒後にこの数が増えていれば正常です');
      results.push('');
    }).catch(()=>{});

    // ③ 書き込みテスト（20秒待つ）
    const writeTimeout = setTimeout(() => {
      results.push('❌ 書き込み: タイムアウト（20秒）');
      results.push('→ 写真登録直後はこのテストが失敗する場合があります');
      results.push('→ 30秒待ってから再度テストしてください');
      results.push('→ それでも失敗する場合はFirebaseルールを確認してください');
      done(results);
    }, 20000);

    FB_DB.ref('yasai/'+FB_KEY+'/diagTest').set({ ts: Date.now() })
    .then(() => {
      clearTimeout(writeTimeout);
      results.push('✅ 書き込み: 成功');
      results.push('→ Firebase は正常に動作しています');
      FB_DB.ref('yasai/'+FB_KEY+'/diagTest').remove();
      done(results);
    })
    .catch(err => {
      clearTimeout(writeTimeout);
      if (err.message && err.message.includes('PERMISSION_DENIED')) {
        results.push('❌ 書き込み: 権限エラー（ルール設定を確認）');
      } else {
        results.push('❌ 書き込みエラー: ' + (err.message || String(err)));
      }
      done(results);
    });
  }).catch(err => {
    if (!connChecked) {
      clearTimeout(connTimeout);
      connChecked = true;
      results.push('❌ 接続確認エラー: ' + (err.message || String(err)));
      done(results);
    }
  });
}

// Promise が指定時間以内に完了しなければタイムアウトとして reject する
// （モバイル回線が不安定だとFirebaseの書き込みが永久に保留され、
//   同期バッジが「同期中」のまま固まることがあるための安全策）
function _withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('タイムアウト（' + (ms/1000) + '秒、通信状況を確認してください）')), ms);
    promise.then(
      v => { clearTimeout(timer); resolve(v); },
      e => { clearTimeout(timer); reject(e); }
    );
  });
}

function disconnectCloud() {
  if (FB_DB && FB_KEY && FB_LISTENER)
    FB_DB.ref('yasai/'+FB_KEY).off('value', FB_LISTENER);
  FB_DB = null; FB_KEY = null; FB_LISTENER = null;
  localStorage.removeItem('yasai_fb');
  updateSyncBadge('none');
}

function updateSyncBadge(status) {
  const el = document.getElementById('sync-badge');
  if (!el) return;
  const MAP = {
    none:       ['',''],
    connecting: ['🔄','クラウドに接続中...'],
    syncing:    ['⏳','同期中...'],
    ok:         ['☁️✅','クラウド同期済み'],
    error:      ['☁️❌','同期エラー（設定を確認）'],
  };
  const [icon, tip] = MAP[status]||['',''];
  el.textContent = icon; el.title = tip;
}

// --- Timeline ---
function renderTimeline(container){
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today); start.setDate(start.getDate()-90);
  const end=new Date(today); end.setDate(end.getDate()+30);
  const dates=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))dates.push(new Date(d));

  // Build lookup: date+vid -> activities[]
  const lookup={};
  D.schedules.forEach(s=>{
    const k=s.date+'|'+s.vid;
    if(!lookup[k])lookup[k]=[];
    lookup[k].push(s);
  });

  const fmtHead=d=>{
    const m=d.getMonth()+1,day=d.getDate();
    const dow=['日','月','火','水','木','金','土'][d.getDay()];
    return`${m}/${day}<br><span style="font-size:9px">${dow}</span>`;
  };

  const headCells=dates.map(d=>{
    const isToday=d.getTime()===today.getTime();
    const isWe=d.getDay()===0||d.getDay()===6;
    return`<th class="tl-date-head${isToday?' today':isWe?' weekend':''}">${fmtHead(d)}</th>`;
  }).join('');

  const rows=D.vegetables.map(v=>{
    const cells=dates.map(d=>{
      const ds=_localDateStr(d);
      const k=ds+'|'+v.id;
      const entries=lookup[k]||[];
      const isToday=d.getTime()===today.getTime();
      if(!entries.length){
        return`<td class="tl-cell${isToday?' today':''}" data-date="${ds}" data-vid="${v.id}"></td>`;
      }
      const dots=entries.slice(0,3).map(e=>`<span class="tl-dot" style="background:${actColor(e.act)}"></span>`).join('');
      const tip=entries.map(e=>e.act).join(' / ').replace(/"/g,'&quot;');
      return`<td class="tl-cell has-data${isToday?' today':''}" data-date="${ds}" data-vid="${v.id}" data-tip="${tip}">${dots}</td>`;
    }).join('');
    const c=vegColor(v);
    return`<tr>
      <td class="tl-veg-col"><button class="tl-veg-btn" data-vid="${v.id}" style="color:${c}">
        <span style="font-size:14px">${vegEmoji(v)}</span>${v.name}
      </button></td>
      ${cells}
    </tr>`;
  }).join('');

  container.innerHTML=`<div id="timeline-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h2>📅 栽培管理一覧</h2>
      <div style="font-size:11px;color:var(--muted)">
        <span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#dc2626"></span>収穫
        </span>
        <span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a"></span>定植
        </span>
        <span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb"></span>水やり
        </span>
        <span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ea580c"></span>仕立
        </span>
        <span style="display:inline-flex;align-items:center;gap:3px">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ca8a04"></span>施肥
        </span>
      </div>
    </div>
    <div class="tl-scroll">
      <table class="tl-table">
        <thead><tr>
          <th class="tl-head-veg">野菜</th>
          ${headCells}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;

  // Scroll to today
  requestAnimationFrame(()=>{
    const wrap=container.querySelector('.tl-scroll');
    const todayCells=container.querySelectorAll('.tl-date-head.today');
    if(todayCells.length&&wrap){
      const cell=todayCells[0];
      wrap.scrollLeft=cell.offsetLeft-200;
    }
  });
}

  const totalAll=Object.values(totals).reduce((a,b)=>a+b,0);
  const summary=Object.entries(totals).map(([vr,n])=>

  ).join('');

  const rows=harvests.map(h=>`

  _renderPhotosPrev();

  document.getElementById('photo-add-btn').addEventListener('click',()=>{
    if(_editPhotos.length<8) document.getElementById('photo-input').click();
  });
  document.getElementById('photo-input').addEventListener('change',function(){
    const files=Array.from(this.files);
    const remaining=8-_editPhotos.length;
    const targets=files.slice(0,remaining);
    if(!targets.length){this.value='';return;}

    // 圧縮中はボタンを無効化してスピナー表示（連打・二重送信防止）
    const addBtn=document.getElementById('photo-add-btn');
    if(addBtn){addBtn.disabled=true;addBtn.textContent='⏳ 処理中...';}

    let loaded=0;
    targets.forEach(f=>{
      _compressImage(f, compressed=>{
        if(compressed) _editPhotos.push(compressed);
        loaded++;
        if(loaded===targets.length){
          _renderPhotosPrev();
          // 圧縮完了後にボタンを再度有効化
          const btn=document.getElementById('photo-add-btn');
          if(btn){btn.disabled=false;btn.textContent='📷 写真を追加';}
        }
      });
    });
    this.value='';
  });
  document.getElementById('photos-preview').addEventListener('click',e=>{
    const btn=e.target.closest('.photo-del');
    if(!btn)return;
    _editPhotos.splice(parseInt(btn.dataset.idx),1);
    _renderPhotosPrev();
  });
}

function showPopup(title, bodyHtml){

  document.getElementById('popup-body').innerHTML=bodyHtml;
  document.getElementById('popup').classList.add('show');
}
function hidePopup(){document.getElementById('popup').classList.remove('show');}

// ===================== HELPERS =====================
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){const p=d.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日';}
// Google Photos共有リンクのボタンHTML（httpsのURLのみ表示）
function gphotoLink(s){
  if(!s.gphoto||!/^https:\/\//.test(s.gphoto))return'';
  return `<div><a href="${escH(s.gphoto)}" target="_blank" rel="noopener" class="gphoto-link">📷 Google Photosで開く</a></div>`;
}

// ===================== EVENTS =====================
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-v],[data-vid],[data-dtab],[data-date]');
  if(!t)return;

  // Nav tabs
  if(t.dataset.v){
    S.view=t.dataset.v; S.editSchedId=null; S.editHarvestId=null; S.editVegId=null;
    if(S.view==='detail'&&!S.selVeg){}
    render(); return;
  }

  // Vegetable sidebar
  if(t.dataset.vid&&!t.dataset.act&&!t.dataset.date){
    S.selVeg=t.dataset.vid; S.view='detail'; S.detailTab='info';
    render(); return;
  }

  // Detail tabs
  if(t.dataset.dtab){
    S.detailTab=t.dataset.dtab;
    render(); // 即時タブ切り替え
    // 収穫タブを開くときは Firebase から最新データを取得して再描画
    if(S.detailTab==='harvest' && FB_DB && FB_KEY){
      _fetchAndMergeHarvests().then(()=>render());
    }
    return;
  }

  // Timeline cell click
  if(t.dataset.date&&t.dataset.vid){
    const date=t.dataset.date, vid=t.dataset.vid;
    const entries=D.schedules.filter(s=>s.date===date&&s.vid===vid);
    const veg=getVeg(vid);
    if(!entries.length){
      // Quick-add
      S.selVeg=vid; S.editSchedId=null;
      S.view='add-sched'; render();
      // Pre-fill date
      const di=document.querySelector('[name="date"]');
      if(di)di.value=date;
    } else {
      const body=entries.map(s=>`<div class="popup-entry">
        <div style="font-weight:bold;color:${actColor(s.act)}">${s.act}</div>
        ${s.timeFrom?`<div style="font-size:11px;color:var(--muted)">${s.timeFrom}${s.timeTo?' - '+s.timeTo:''}</div>`:''}
        ${s.plan?'<span class="badge badge-plan">予定</span>':'<span class="badge badge-actual">実績</span>'}
        ${s.memo?`<div style="font-size:12px;color:var(--muted);margin-top:4px">📝 ${s.memo}</div>`:''}
        ${(()=>{const ps=s.photos&&s.photos.length?s.photos:s.photo?[s.photo]:[];if(!ps.length)return'';_photoGroups[s.id]=ps;return`<div class="detail-photos">${ps.map((src,i)=>`<img src="${src}" data-gid="${s.id}" data-idx="${i}" class="viewable-photo" alt="写真${i+1}" style="cursor:zoom-in">`).join('')}</div>`;})()}
        ${gphotoLink(s)}
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn btn-outline" style="font-size:11px;padding:2px 8px" data-act="edit-sched" data-id="${s.id}">✏️</button>
          <button class="btn btn-danger" style="font-size:11px;padding:2px 8px" data-act="del-sched" data-id="${s.id}">🗑️</button>
        </div>
      </div>`).join('');
      showPopup(`${vegEmoji(veg)} ${veg.name} - ${fmtDate(date)}`,body);
    }
    return;
  }

  const act=t.dataset.act;
  if(!act)return;

  // Actions
  if(act==='edit-sched'){
    S.editSchedId=t.dataset.id; S.view='add-sched'; hidePopup(); render(); return;
  }
  if(act==='del-sched'){
    if(!confirm('この記録を削除しますか？'))return;
    _pendingPhotoDeletes.add(t.dataset.id);
    D.schedules=D.schedules.filter(s=>s.id!==t.dataset.id);
    saveData(); hidePopup(); render(); return;
  }
  if(act==='edit-harvest'){
    S.editHarvestId=t.dataset.id; S.view='add-harvest'; render(); return;
  }
  if(act==='del-harvest'){
    if(!confirm('この収穫記録を削除しますか？'))return;
    const delId=t.dataset.id;
    _pendingHarvestDeletes.add(delId);
    D.harvests=D.harvests.filter(h=>h.id!==delId);
    saveData();
    // harvestsById からも即座に削除
    if(FB_DB&&FB_KEY) FB_DB.ref('yasai/'+FB_KEY+'/harvestsById/'+delId).remove();
    render(); return;
  }
  if(act==='edit-veg'){
    S.editVegId=t.dataset.vid; S.view='add-veg'; render(); return;
  }
  if(act==='add-sched-for'){
    S.selVeg=t.dataset.vid; S.editSchedId=null; S.view='add-sched'; render(); return;
  }
  if(act==='add-harvest-for'){
    S.selVeg=t.dataset.vid; S.editHarvestId=null; S.view='add-harvest'; render(); return;
  }
});

// Schedule form submit
document.addEventListener('submit',e=>{
  if(e.target.id==='sched-form'){
    e.preventDefault();
    const fd=new FormData(e.target);
    // 複数チェックされた実施事項を収集し「・」で結合
    const checkedActs=Array.from(e.target.querySelectorAll('input[name="acts"]:checked')).map(cb=>cb.value);
    const customAct=(fd.get('actCustom')||'').trim();
    const allActs=[...checkedActs,...(customAct?[customAct]:[])];
    if(!allActs.length){alert('実施事項を1つ以上選択または入力してください');return;}
    const act=allActs.join('・');
    // _editPhotos は renderSchedForm() 内で初期化済み
    // null（圧縮失敗）は除外してから保存
    const photos = _editPhotos.filter(Boolean).slice(0, 8);
    // Google Photosリンク：https のURLのみ許可（誤入力・不正スキームを弾く）
    let gphoto=(fd.get('gphoto')||'').trim();
    if(gphoto && !/^https:\/\//.test(gphoto)){
      alert('Google Photosリンクは https:// で始まるURLを貼り付けてください');
      return;
    }
    const entry={
      id:S.editSchedId||newId(),
      vid:fd.get('vid'),
      date:fd.get('date'),
      timeFrom:fd.get('timeFrom')||'',
      timeTo:fd.get('timeTo')||'',
      act,
      memo:fd.get('memo')||'',
      photos,                    // 最大8枚の配列
      photo:photos[0]||null,     // 後方互換のため先頭を残す
      gphoto,                    // Google Photos共有リンク（任意）
      plan:fd.get('plan')==='true'
    };
    if(S.editSchedId){
      const idx=D.schedules.findIndex(s=>s.id===S.editSchedId);
      if(idx>=0)D.schedules[idx]=entry;
      else D.schedules.push(entry); // 万一インデックスが見つからない場合も追加
    } else D.schedules.push(entry);
    // この記録の写真は変更された可能性があるため、再送信が必要な状態にする
    if (photos.length > 0) _syncedPhotoIds.delete(entry.id);
    // saveData() のエラー（localStorage容量超過等）でも必ず画面遷移する
    try { saveData(); } catch(e) { saveToCloud(); }
    // 写真がある場合はデバウンスを待たずに即座にFirebaseへ書き込む
    // （リスナーの競合・タイミング問題を回避するため）
    if (photos.length > 0 && FB_DB && FB_KEY) {
      const pushPhotos = localStorage.getItem('yasai_photo_push') !== 'false';
      if (pushPhotos) {
        const photoUpdate = {};
        photoUpdate['yasai/'+FB_KEY+'/photos/'+entry.id] = photos;
        FB_DB.ref().update(photoUpdate)
          .then(() => { _syncedPhotoIds.add(entry.id); updateSyncBadge('ok'); })
          .catch(err => { console.warn('写真の即時保存エラー:', err); updateSyncBadge('error'); });
      }
    }
    S.editSchedId=null;
    S.selVeg=entry.vid;
    S.view='detail'; S.detailTab='schedule';
    render();
    return;
  }

  if(e.target.id==='harvest-form'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const variety=(fd.get('varietyCustom')||'').trim()||(fd.get('variety')||'').trim()||'';
    const entry={
      id:S.editHarvestId||newId(),
      vid:fd.get('hvid'),
      variety,
      date:fd.get('date'),
      count:parseInt(fd.get('count'))||0,
      memo:fd.get('memo')||''
    };
    if(S.editHarvestId){
      const idx=D.harvests.findIndex(h=>h.id===S.editHarvestId);
      if(idx>=0)D.harvests[idx]=entry;
      else D.harvests.push(entry); // 万一インデックスが見つからない場合も追加
    } else D.harvests.push(entry);
    saveData();
    // 収穫データをデバウンスを待たずに即座にFirebaseへ直接書き込む
    // （写真と同じ仕組み：リスナー競合・debounce問題を回避）
    if (FB_DB && FB_KEY) {
      updateSyncBadge('syncing');
      // 個別のエントリを yasai/KEY/harvestsById/ID に書き込む（個別パスで競合を防ぐ）
      const harvestUpdate = {};
      harvestUpdate['yasai/'+FB_KEY+'/harvestsById/'+entry.id] = entry;
      // meta/harvests も合わせて更新して整合性を保つ
      harvestUpdate['yasai/'+FB_KEY+'/meta/harvests'] = D.harvests;
      _withTimeout(FB_DB.ref().update(harvestUpdate), 20000)
        .then(() => updateSyncBadge('ok'))
        .catch(err => { console.warn('収穫データ即時保存エラー:', err); updateSyncBadge('error'); });
    }
    S.editHarvestId=null;
    S.selVeg=entry.vid; S.view='detail'; S.detailTab='harvest';
    render();
    return;
  }

  if(e.target.id==='veg-form'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const vid=fd.get('vid');
    const isEdit=D.vegetables.some(v=>v.id===vid);
    const varieties=(fd.get('varieties')||'').split(',').map(s=>s.trim()).filter(Boolean);
    const entry={
      id:vid, name:fd.get('name'), varieties,
      tax:{order:fd.get('taxOrder')||'',family:fd.get('taxFamily')||'',genus:fd.get('taxGenus')||''},
      traits:{origin:fd.get('origin')||'',coldHeat:fd.get('coldHeat')||'',
              water:fd.get('water')||'',fertilizer:fd.get('fertilizer')||'',other:fd.get('otherTraits')||''},
      mgmt:{soil:fd.get('soil')||'',ridge:fd.get('ridge')||'',sow:fd.get('sow')||'',
            transplant:fd.get('transplant')||'',water:fd.get('mgWater')||'',train:fd.get('train')||'',
            fertilize:fd.get('fertilize')||'',bud:fd.get('bud')||'',leaf:fd.get('leaf')||'',
            spray:fd.get('spray')||'',flowerFruit:fd.get('flowerFruit')||'',
            harvest:fd.get('harvest')||'',storage:fd.get('storage')||'',expected:fd.get('expected')||''},
      color:parseInt(fd.get('color'))||0
    };
    if(isEdit){
      const idx=D.vegetables.findIndex(v=>v.id===vid);
      if(idx>=0)D.vegetables[idx]=entry;
    } else {
      entry.color=D.vegetables.length%VEG_COLORS.length;
      D.vegetables.push(entry);
    }
    saveData();
    S.editVegId=null; S.selVeg=vid; S.view='detail'; S.detailTab='info';
    render();
    return;
  }
});

// Firebase form submit
document.addEventListener('submit', e => {
  if (e.target.id !== 'firebase-form') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  let raw = (fd.get('fbConfig')||'').trim();
  const key = (fd.get('fbKey')||'').trim();
  const dbUrl = (fd.get('dbUrl')||'').trim();

  if (!key) { alert('同期キー（③）を入力してください'); return; }
  if (!dbUrl) { alert('データベースURL（②）を入力してください'); return; }
  if (!dbUrl.startsWith('https://')) {
    alert('データベースURLは https:// で始まるURLを入力してください。\n例: https://your-app-default-rtdb.asia-southeast1.firebasedatabase.app');
    return;
  }

  // Firebaseコンソールが出力するJS形式をそのままJSとして実行して取得する
  let config = {};
  if (raw) {
    try {
      let code = raw;
      // 「firebaseConfig =」という代入文が含まれていない場合は補完する
      if (!/firebaseConfig\s*=/.test(code)) {
        const inner = code.trim().startsWith('{') ? code : '{' + code + '}';
        code = 'var firebaseConfig = ' + inner;
      }
      // new Function で安全にJSオブジェクトを取得
      // eslint-disable-next-line no-new-func
      config = new Function(code + ';\nreturn firebaseConfig;')();
      if (!config || typeof config !== 'object') throw new Error('not object');
    } catch(err) {
      alert(
        'Firebase設定（①）の読み取りに失敗しました。\n\n' +
        'Firebaseコンソールで表示される\n\n' +
        'const firebaseConfig = {\n' +
        '  apiKey: "...",\n' +
        '  ...\n' +
        '};\n\n' +
        'を「const から ; まで」丸ごとコピーして貼り付けてください。\n' +
        '（①は省略可能です。②のURLと③のキーだけでも動作します）'
      );
      return;
    }
  }

  // ② で入力したURLを最優先で使用（fbConfigのdatabaseURLを上書き）
  config.databaseURL = dbUrl;

  localStorage.setItem('yasai_fb', JSON.stringify({config, key}));
  FB_KEY = key;
  render(); // 即座に「接続中...」画面を表示
  initFirebase(config); // 非同期でFirebase接続（完了後に再度renderされる）
});

// ===================== LIGHTBOX =====================
let _lbPhotos=[], _lbIdx=0;
let _lbTouchStartX=0;

function showLightbox(photos, idx){
  _lbPhotos=photos; _lbIdx=idx;
  const lb=document.getElementById('lightbox');
  lb.style.display='flex';
  _updateLightbox();
}
function hideLightbox(){
  document.getElementById('lightbox').style.display='none';
}
function _updateLightbox(){
  document.getElementById('lightbox-img').src=_lbPhotos[_lbIdx];
  const multi=_lbPhotos.length>1;
  const prev=document.getElementById('lightbox-prev');
  const next=document.getElementById('lightbox-next');
  prev.style.display=multi?'flex':'none';
  next.style.display=multi?'flex':'none';
  document.getElementById('lightbox-counter').textContent=
    multi?(_lbIdx+1)+' / '+_lbPhotos.length:'';
}

// ライトボックスボタン操作
document.getElementById('lightbox-close').addEventListener('click',hideLightbox);
document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target.id==='lightbox') hideLightbox();
});
document.getElementById('lightbox-prev').addEventListener('click',e=>{
  e.stopPropagation();
  _lbIdx=(_lbIdx-1+_lbPhotos.length)%_lbPhotos.length; _updateLightbox();
});
document.getElementById('lightbox-next').addEventListener('click',e=>{
  e.stopPropagation();
  _lbIdx=(_lbIdx+1)%_lbPhotos.length; _updateLightbox();
});

// スマホスワイプ対応
document.getElementById('lightbox').addEventListener('touchstart',e=>{
  _lbTouchStartX=e.touches[0].clientX;
},{passive:true});
document.getElementById('lightbox').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_lbTouchStartX;
  if(Math.abs(dx)>50&&_lbPhotos.length>1){
    _lbIdx=dx<0?(_lbIdx+1)%_lbPhotos.length:(_lbIdx-1+_lbPhotos.length)%_lbPhotos.length;
    _updateLightbox();
  }
},{passive:true});

// キーボード操作
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lightbox');
  if(lb.style.display!=='flex')return;
  if(e.key==='Escape')hideLightbox();
  if(e.key==='ArrowLeft'&&_lbPhotos.length>1){_lbIdx=(_lbIdx-1+_lbPhotos.length)%_lbPhotos.length;_updateLightbox();}
  if(e.key==='ArrowRight'&&_lbPhotos.length>1){_lbIdx=(_lbIdx+1)%_lbPhotos.length;_updateLightbox();}
});

// 写真クリックでライトボックス表示（全画面）
document.addEventListener('click',e=>{
